services:
  postgres:
    image: postgres:15-alpine
    container_name: 4epices_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: "4epices"
      POSTGRES_USER: "4epices"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - 4epices_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: 4epices_backend
    restart: unless-stopped
    # Toute la configuration du backend (Groq, Instagram, Pinterest, DB...) vit
    # dans backend/.env. Ne pas la redéclarer ici via ${VAR:-} : un bloc
    # `environment:` est prioritaire sur `env_file` et lit le .env racine,
    # ce qui écrase les valeurs de backend/.env par des chaînes vides.
    env_file:
      - ./backend/.env
    ports:
      - "1337:1337"
    volumes:
      - ./backend:/opt/app
      - /opt/app/node_modules
      - ./backend/uploads:/opt/app/public/uploads
    depends_on:
      - postgres
    networks:
      - 4epices_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_STRAPI_URL: ${NEXT_PUBLIC_STRAPI_URL:-https://api.4epices.fr}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://4epices.fr}
    container_name: 4epices_frontend
    restart: unless-stopped
    environment:
      # URL pour les requêtes serveur (SSR) - utilise le service Docker
      STRAPI_URL: http://backend:1337
      # Secret admin (serveur uniquement, jamais NEXT_PUBLIC_*) : voir ADMIN_AUTH.md
      ADMIN_SECRET: ${ADMIN_SECRET:-}
      # Secret partagé frontend -> backend pour les routes admin de Strapi (même valeur que dans backend/.env)
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-}
      # Liens d'affiliation Amazon Associates (bloc « Ustensiles » des pages recette)
      ENABLE_AFFILIATE_LINKS: ${ENABLE_AFFILIATE_LINKS:-false}
      AMAZON_ASSOCIATES_TAG: ${AMAZON_ASSOCIATES_TAG:-}
      # URL publique pour le client (déjà dans NEXT_PUBLIC_STRAPI_URL)
      # Configuration IA (Groq recommandé - gratuit et performant)
      AI_PROVIDER: ${AI_PROVIDER:-groq}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      # Fallback Ollama (optionnel)
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      # Fallback OpenAI (optionnel)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # TTS local pour le Mode Cuisine
      KOKORO_TTS_URL: ${KOKORO_TTS_URL:-http://kokoro-tts:8880}
      KOKORO_TTS_VOICE: ${KOKORO_TTS_VOICE:-ff_siwis}
    ports:
      - "3000:3000"
    depends_on:
      - backend
      - kokoro-tts
    networks:
      - 4epices_network

  kokoro-tts:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    container_name: 4epices_kokoro_tts
    restart: unless-stopped
    expose:
      - "8880"
    networks:
      - 4epices_network

  # Plus de conteneur « cron » : les queues Instagram et Pinterest sont traitées par le cron
  # intégré de Strapi (backend/config/cron-tasks.js, activé dans backend/config/server.js).

networks:
 4epices_network:
   driver: bridge

volumes:
  postgres_data:
  ollama_data:
